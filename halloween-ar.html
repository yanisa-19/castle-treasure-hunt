<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween AR Grammar Hunt</title>
<!-- MediaPipe Hands (ต้องใช้อินเทอร์เน็ต) ถ้าโหลดไม่ได้ เกมจะเปลี่ยนเป็นโหมดเมาส์/ทัชอัตโนมัติ -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#120a1f;--or:#ff8a1f;--pur:#6a3fb5;--g:#3ddc84;--tx:#fff4e6}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.5}
#shade{position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0,#7b2cbfd0,transparent 55%),radial-gradient(ellipse at 95% 35%,#ff6b9a66,transparent 50%),radial-gradient(ellipse at 10% 100%,#1fb6c966,transparent 55%),#120a1fee}
#ui{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 6px)}
#hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:1rem}
#hud span,#hud b{background:#0008;border-radius:99px;padding:3px 12px}
.bar{height:12px;background:#0008;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3ddc84,#4cc9f0,#c77dff)}
#q{margin-top:5vh;text-align:center;font-weight:700;font-size:clamp(1.4rem,5vw,2.3rem);line-height:1.4;text-shadow:0 2px 8px #000}
#q.ok{color:var(--g)}
.slot{display:inline-block;min-width:3.4em;min-height:1.3em;border-bottom:4px dashed var(--or);color:#ffd24a;padding:0 8px;vertical-align:bottom}
#q.ok .slot{background:#3ddc8455;border-color:var(--g)}
#notes{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:5vh}
.note{position:relative;min-width:96px;padding:14px 20px;text-align:center;font-weight:700;font-size:1.35rem;color:#0b3d1e;background:linear-gradient(135deg,#c8f5d7,#6fd29a 60%,#4cbf82);border:3px double #1f7a45;border-radius:8px;box-shadow:0 4px 0 #1c6b3e;cursor:grab}
.note::before{content:"฿";position:absolute;left:6px;top:1px;font-size:.7rem;opacity:.6}
.tile{min-width:54px;padding:10px 12px}
.ghost{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-50%) rotate(-6deg) scale(1.12);box-shadow:0 14px 22px #000a}
.held{opacity:.25}.used{visibility:hidden}
.b{font:inherit;font-weight:700;font-size:1.1rem;background:var(--or);color:#2a1300;border:0;border-radius:12px;padding:12px 22px;box-shadow:0 4px 0 #b05a00;cursor:pointer}
#hint{text-align:center;font-size:.95rem;color:#ffd9a8;margin-top:4px}
#typebox{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:3vh}
#opt{color:#ffd24a;font-weight:700;font-size:1.1rem}
#ans{font:inherit;font-size:1.4rem;width:min(90%,360px);padding:10px;border-radius:12px;border:3px solid var(--or);background:#1d1033;color:#fff;text-align:center;-webkit-user-select:text;user-select:text;touch-action:auto}
#kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
.k{font:inherit;font-weight:700;font-size:1.1rem;min-width:36px;padding:8px 6px;background:#3b2468;color:#fff;border:2px solid var(--pur);border-radius:8px}
.pn{font:inherit;font-size:1.2rem;width:min(100%,280px);padding:10px;border-radius:12px;border:3px solid var(--or);background:#1d1033;color:#fff;text-align:center;-webkit-user-select:text;user-select:text;touch-action:auto}
.rank{width:100%;border-collapse:collapse;margin-top:8px;font-size:1.05rem}
.rank th,.rank td{padding:6px 8px;border-bottom:1px solid var(--pur);text-align:left}
.rank td:last-child,.rank th:last-child{text-align:right}
.rank tr.me{background:#ff8a1f33;font-weight:700}
/* ===== สีสัน ===== */
#hm{background:linear-gradient(90deg,#ff8a1f,#ffb347);color:#2a1300}
#hq{background:#1fb6c9cc;color:#02272c}
#hs{background:#ffd24acc;color:#3a2a00}
#hk{background:#ff6b9acc}
#q{text-shadow:0 0 14px #c77dff,0 2px 6px #000}
.slot{border-bottom-color:#4cc9f0}
.note.c1{background:linear-gradient(135deg,#fff0b3,#ffb347);border-color:#b36d12;box-shadow:0 4px 0 #b36d12;color:#4a2a00}
.note.c2{background:linear-gradient(135deg,#ffd0dc,#ff6b9a);border-color:#a8335b;box-shadow:0 4px 0 #a8335b;color:#4a0d24}
.note.c3{background:linear-gradient(135deg,#c9ecff,#4cc9f0);border-color:#1b7d98;box-shadow:0 4px 0 #1b7d98;color:#032a36}
.note.c4{background:linear-gradient(135deg,#e6d4ff,#a56bff);border-color:#5b2fb0;box-shadow:0 4px 0 #5b2fb0;color:#21083f}
.k:nth-child(5n+1){background:#7c3aed}.k:nth-child(5n+2){background:#db2777}.k:nth-child(5n+3){background:#0891b2}.k:nth-child(5n+4){background:#d97706}.k:nth-child(5n){background:#059669}
.card{border-color:#c77dff;box-shadow:0 0 26px #c77dff88,0 8px 0 #0b0614}
.card h1,.card h2{background:linear-gradient(90deg,#ff8a1f,#ffd24a,#3ddc84,#4cc9f0,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.b{background:linear-gradient(180deg,#ffc15e,#ff8a1f)}
.rank tr:nth-child(2) td{background:#ffd24a40}.rank tr:nth-child(3) td{background:#cfd8e540}.rank tr:nth-child(4) td{background:#cd7f3240}
.fl{position:fixed;bottom:0;z-index:2;opacity:.55;pointer-events:none;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(360deg)}}
#mute{position:fixed;z-index:10;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px 12px;font-size:1.1rem}
#clk{position:fixed;z-index:10;left:50%;top:20%;pointer-events:none;text-align:center;font-weight:700;transform:translate(-50%,-50%);animation:clkin 2.5s ease forwards}
#clk b{display:block;font-size:5rem;animation:ring .3s linear 8}
#clk span{background:#000c;border:2px solid #ff8a1f;border-radius:99px;padding:4px 14px;font-size:1.05rem;white-space:nowrap}
@keyframes clkin{0%{transform:translate(-320%,-320%) scale(.2) rotate(-360deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.3);opacity:1}40%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
@keyframes ring{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
#warn{position:fixed;z-index:6;right:10px;top:calc(env(safe-area-inset-top,0px) + 64px);text-align:center;pointer-events:none;font-weight:700}
#warn b{display:block;font-size:3.4rem;line-height:1;color:#ff6b6b;text-shadow:0 0 18px #ff3b3b;animation:beat .5s ease-in-out infinite alternate}
#warn span{display:inline-block;background:#000c;border:2px solid #ff6b6b;border-radius:99px;padding:2px 12px;font-size:.9rem}
@keyframes beat{from{transform:scale(.9)}to{transform:scale(1.25)}}
@keyframes redglow{from{opacity:.35}to{opacity:1}}
body.alert::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 90px #ff3b3b;animation:redglow .5s ease-in-out infinite alternate}
.rank td:nth-child(3){white-space:nowrap}
#boom{position:fixed;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#fff,#ffb347 35%,transparent 70%);animation:flash 1.5s ease-out forwards}
#boom b{font-size:min(70vw,60vh);line-height:1;animation:bpop 1.5s ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
@keyframes bpop{0%{transform:scale(.1) rotate(0)}30%{transform:scale(1) rotate(12deg)}100%{transform:scale(1.5) rotate(-8deg);opacity:0}}
#ui.jolt{animation:jolt .12s linear 8}
@keyframes jolt{0%,100%{transform:translate(0)}25%{transform:translate(-14px,8px)}50%{transform:translate(12px,-10px)}75%{transform:translate(-8px,-6px)}}
#mon{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
#me{font-size:3rem;line-height:1;display:inline-block;animation:bob 1.2s ease-in-out infinite}
#me.hit{animation:hit .5s ease}
.hp{width:min(46vw,200px);height:14px;background:#0008;border:2px solid #ff6b6b;border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ffd24a);transition:width .5s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-16px) rotate(-12deg);filter:brightness(2.2)}75%{transform:translateX(16px) rotate(12deg)}}
.chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.ch{font:inherit;font-size:.8rem;color:#fff;background:#3b2468;border:3px solid var(--pur);border-radius:14px;padding:6px 10px;cursor:pointer}
.ch b{display:block;font-size:2rem}.ch.sel{border-color:#ffd24a;background:#6a3fb5;transform:scale(1.1)}
.s3{margin-top:auto;height:min(36vh,300px);position:relative}
#gl{width:100%;height:100%;display:block;touch-action:none}
.menu #hud,.menu .bar,.menu #items,.menu #mon,.menu #q,.menu #hint,.menu #notes,.menu #typebox,.menu #clr{visibility:hidden}
#ov.light{background:#0000;align-items:flex-start;pointer-events:none}
#ov.light .card{pointer-events:auto;margin-top:calc(env(safe-area-inset-top,0px) + 6px);max-height:56vh;background:#2a1650ee}
#hud{flex-wrap:wrap;font-size:.9rem}#hc{background:#ffd24acc;color:#3a2a00}
#items{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:30px}
.it{font:inherit;font-weight:700;background:#3b2468;color:#fff;border:2px solid #ffd24a;border-radius:99px;padding:2px 12px;font-size:.9rem}
.it:disabled{opacity:.45}.glow{box-shadow:0 0 0 4px #ffd24a,0 0 18px #ffd24a}
#clr{align-self:center}.hide{display:none!important}
#ov{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#000a;padding:16px}
.card{max-width:560px;max-height:92vh;overflow:auto;touch-action:pan-y;background:#2a1650;border:3px solid var(--pur);border-radius:20px;padding:22px;text-align:center;box-shadow:0 8px 0 #0b0614}
.card h1,.card h2{margin:.2em 0;color:var(--or)}.card p{margin:.5em 0;font-size:1.1rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 52px);left:50%;transform:translateX(-50%);background:#000b;border-radius:99px;padding:4px 14px;font-size:.9rem}
#fx{position:fixed;inset:0;z-index:9;pointer-events:none}
/* ตัวการ์ตูน 3D (CSS) */
.stage{position:relative;margin-top:auto;height:110px;perspective:500px}
.hero{position:absolute;left:50%;top:56px;width:0;height:0;transform-style:preserve-3d;animation:sway 5s ease-in-out infinite}
.hero.jump{animation:hj .8s ease 1}.hero.shake{animation:hs .5s ease 1}
.cube{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;background:var(--c);border:2px solid #0004;box-sizing:border-box}
.fr,.bk{width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2)}
.lf,.rt{width:var(--d);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--d)/-2)}
.tp,.bt{width:var(--w);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--w)/-2)}
.fr{transform:translateZ(calc(var(--d)/2))}.bk{transform:rotateY(180deg) translateZ(calc(var(--d)/2));filter:brightness(.7)}
.lf{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));filter:brightness(.85)}.rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));filter:brightness(.85)}
.tp{transform:rotateX(90deg) translateZ(calc(var(--h)/2));filter:brightness(1.2)}.bt{transform:rotateX(-90deg) translateZ(calc(var(--h)/2));filter:brightness(.6)}
@keyframes sway{0%,100%{transform:rotateY(-35deg)}25%,75%{transform:rotateY(0) translateY(-6px)}50%{transform:rotateY(35deg)}}
@keyframes hj{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-40px) rotateY(180deg)}100%{transform:translateY(0) rotateY(360deg)}}
@keyframes hs{0%,100%{transform:rotateZ(0)}25%{transform:rotateZ(-12deg)}75%{transform:rotateZ(12deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<video id="cam" playsinline muted></video><div id="shade"></div>
<div id="ui">
  <div id="hud"><b id="hm"></b><span id="hq"></span><span id="hs">⭐ 0</span><span id="hc">🪙 0</span><span id="hk"></span></div>
  <div class="bar"><i id="tb"></i></div>
  <div id="mon"><span id="me"></span><div class="hp"><i id="hpb"></i></div></div>
  <div id="q"></div>
  <div id="hint"></div>
  <div id="notes"></div>
  <div id="typebox" class="hide"><div id="opt"></div>
    <input id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="พิมพ์คำตอบที่นี่...">
    <div id="kb"></div><button class="b" id="chk">ตรวจคำตอบ ✔</button></div>
  <button class="b hide" id="clr">↺ Clear</button>
  <div id="items"></div>
  <div class="stage" aria-hidden="true"><div id="hero" class="hero"></div></div>
  <div class="s3 hide" id="s3" aria-hidden="true"><canvas id="gl"></canvas></div>
</div>
<div id="toast" class="hide"></div>
<div id="warn" class="hide"></div>
<button class="b" id="mute" aria-label="Sound on/off">🔊</button>
<div id="ov"><div class="card" id="ovc"></div></div>
<canvas id="fx"></canvas>

<script>
/* =====================================================
   ส่วนตั้งค่า + ข้อมูลโจทย์ (ครูแก้ไขได้ที่นี่)
   ===================================================== */
const TIME = 15;      // วินาทีต่อข้อ
const BATTLE_Q = 5;   // ข้อต่อการสู้มอนสเตอร์ 1 ตัว (สุ่มจาก 8 ข้อของ Mission นั้น) ตอบผิด = เริ่มสู้ใหม่
const BOSS_Q = 10;    // ข้อในด่านบอส (สุ่มจากประโยคทั้งหมดของทุก Mission)
const BOSS_HEARTS = 3;// หัวใจของผู้เล่นในด่านบอส
const BOSS_PTS = 20;  // คะแนนต่อข้อในด่านบอส
const STREAK = 3;     // ตอบถูกติดกันกี่ข้อ ถึงเปิดหีบ
const PTS = 10;       // คะแนนต่อข้อ
const FRIEND_PTS = 30;// แต้มเพื่อนในหีบ

// Mission 1: q = โจทย์, a = คำตอบ (s / es / none), why = คำอธิบายเมื่อตอบผิด
const M1 = [
 {q:"She doesn't ___ (like) ghosts.", a:"none", why:"หลัง doesn't ใช้กริยาช่องเดิม ไม่เติม s/es → doesn't like"},
 {q:"He ___ (play) football.", a:"s", why:"He/She/It + กริยา ต้องเติม s → plays"},
 {q:"My dog doesn't ___ (eat) candy.", a:"none", why:"หลัง doesn't ไม่เติม s/es → doesn't eat"},
 {q:"The witch ___ (watch) the moon.", a:"es", why:"watch ลงท้ายด้วย ch ต้องเติม es → watches"},
 {q:"It doesn't ___ (fly) at night.", a:"none", why:"หลัง doesn't ไม่เติม s/es → doesn't fly"},
 {q:"She ___ (go) to the party.", a:"es", why:"go เติม es → goes"},
 {q:"The cat doesn't ___ (sleep) here.", a:"none", why:"หลัง doesn't ไม่เติม s/es → doesn't sleep"},
 {q:"He ___ (wash) the pumpkin.", a:"es", why:"wash ลงท้ายด้วย sh ต้องเติม es → washes"}];
// Mission 2: เรียงตัวอักษรให้เป็นคำ (a = คำตอบ ตัวพิมพ์ใหญ่)
const M2 = [
 {q:"He ___ have the key.", a:"DOESN'T", why:"He ใช้ doesn't"},
 {q:"They ___ like candy.", a:"DON'T", why:"They ใช้ don't"},
 {q:"She ___ a witch.", a:"ISN'T", why:"She + is not → isn't"},
 {q:"We ___ scared of ghosts.", a:"AREN'T", why:"We + are not → aren't"},
 {q:"I do ___ like spiders.", a:"NOT", why:"do + not → do not"},
 {q:"She doesn't ___ TV. (ดู)", a:"WATCH", why:"หลัง doesn't ใช้กริยาช่องเดิม → watch"},
 {q:"He doesn't ___ here. (เล่น)", a:"PLAY", why:"หลัง doesn't ใช้กริยาช่องเดิม → play"},
 {q:"The ghost doesn't ___ candy. (ชอบ)", a:"LIKE", why:"หลัง doesn't ใช้กริยาช่องเดิม → like"}];
// Mission 3: o = ตัวเลือก (ธนบัตร)
const M3 = [
 {q:"I ___ scared of the dark.", o:["am not","don't"], a:"am not", why:"scared เป็นคุณศัพท์ → ใช้ be + not (am not)"},
 {q:"She ___ like spiders.", o:["doesn't","isn't"], a:"doesn't", why:"like เป็นกริยาทั่วไป → doesn't"},
 {q:"They ___ afraid of bats.", o:["aren't","don't"], a:"aren't", why:"afraid เป็นคุณศัพท์ → aren't"},
 {q:"He ___ eat candy at night.", o:["doesn't","isn't"], a:"doesn't", why:"eat เป็นกริยาทั่วไป → doesn't"},
 {q:"We ___ in the haunted house.", o:["aren't","don't"], a:"aren't", why:"in the house บอกที่อยู่ → be + not (aren't)"},
 {q:"The cat ___ a ghost.", o:["isn't","doesn't"], a:"isn't", why:"a ghost เป็นคำนาม ตามหลัง is → isn't"},
 {q:"I ___ like pumpkin soup.", o:["don't","am not"], a:"don't", why:"like เป็นกริยาทั่วไป → don't"},
 {q:"It ___ scary.", o:["isn't","doesn't"], a:"isn't", why:"scary เป็นคุณศัพท์ → isn't"}];
const HAND = "🖐️ จีบนิ้วโป้ง+นิ้วชี้ = จับธนบัตร เลื่อนไปที่ช่องว่าง แล้วปล่อยนิ้วเพื่อวาง";
const MISSIONS = [
 {name:"The Chamber of the S-Eraser", data:M1, opts:[["+s","s"],["+es","es"],["no s/es","none"]],
  how:"ต้องเติม s, es หรือไม่เติมอะไรเลย? เลือกธนบัตรคำตอบ",
  hint:"💡 คำใบ้: หลัง doesn't ไม่เติม s/es · กริยาลงท้าย ch, sh, o, s, x เติม es · นอกนั้นเติม s"},
 {name:"The Ultimate Master Chest", data:M2, letters:true,
  how:"จับตัวอักษรไปเรียงที่ช่องว่างให้เป็นคำที่ถูกต้อง",
  hint:"💡 คำใบ้: He/She/It → doesn't · I/You/We/They → don't · is/are + not → isn't, aren't"},
 {name:"The Mirror of Illusion", data:M3, typed:true,
  how:"เลือกคำที่ถูกต้องระหว่าง don't / doesn't และ am not / isn't / aren't แล้วเขียนตอบ",
  hint:"💡 คำใบ้: กริยาทั่วไป (like, eat) → don't/doesn't · คำคุณศัพท์/คำนาม/ที่อยู่ → am/is/are + not · He/She/It → doesn't, isn't"}];

/* =====================================================
   สถานะเกม + ฟังก์ชันหลัก
   ===================================================== */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const S = {m:0,i:0,q:[],score:0,coins:0,cStart:0,inv:{shield:0,time:0,hint:0,sword:0},sword:false,streak:0,mStart:0,hearts:1,order:[],left:[],locked:true,placed:"",t0:0,grab:null,sec:0};
let handMode = false, tm = null, PLAYER = "Player", memBoard = [];
/* ตัวละครให้เลือก [อีโมจิ, ชื่อ, สีหัว 3D] และมอนสเตอร์ของแต่ละ Mission (ตัวสุดท้ายคือบอส) */
const CHARS = [["🧛","Vampire","#7c3aed"],["🧙","Witch","#16a34a"],["🎃","Pumpkin","#ff8a1f"],["👻","Ghost","#9ca3af"],["🧟","Zombie","#65a30d"],["💀","Skeleton","#e5e7eb"]];
const MON = [["👹","Ogre"],["🕷️","Giant Spider"],["🐺","Werewolf"],["🐉","Dragon Boss"]];
/* ร้านค้า: [id, ไอคอน, ชื่อ, คำอธิบาย, ราคา(เหรียญ)] ครูปรับราคาได้ที่นี่ */
const SHOP = [["shield","🛡️","Shield","กันตอบผิด 1 ครั้ง (ไม่ต้องเริ่มสู้ใหม่)",60],["time","⏱️","Time Potion","เพิ่มเวลา +7 วินาที (กดใช้ตอนตอบ)",30],
              ["hint","💡","Hint Crystal","ตัวช่วยใบ้คำตอบ (กดใช้ตอนตอบ)",30],["sword","⚔️","Fire Sword","คะแนน/เหรียญ ×2 ตลอดการสู้มอนสเตอร์ตัวถัดไป",80]];
let AV = CHARS[0];
var G = {on:false, mode:"idle", act:null, at:0, dead:false, px:0, mx:2.6, ms:1, doors:[], opening:-1, ot:0, walk:null, nextPoke:0, poke:0};   // สถานะฉาก 3D (three.js)
function setAvatar(){ if (G.on) buildPlayer(); const h = $("hero"); h.children[0].style.setProperty("--c", AV[2]); h.children[0].querySelector(".fr").textContent = AV[0]; }

/* หน้าต่างข้อความ btns = [[ข้อความปุ่ม, ฟังก์ชัน], ...] */
function showOv(html, btns, light){
  $("ovc").innerHTML = html + '<div class="row" id="orow"></div>';
  btns.forEach(([t,fn]) => { const b = document.createElement("button"); b.className="b"; b.textContent=t; b.onclick=()=>{ $("ov").classList.add("hide"); fn(); }; $("orow").appendChild(b); });
  $("ov").classList.toggle("light", !!light); $("ov").classList.remove("hide");
}
function gain(n){ S.score += n; S.coins += n; }      // ได้คะแนน = ได้เหรียญด้วย (เหรียญใช้ซื้อของ คะแนนใช้จัดอันดับ)
function hud(){ $("hs").textContent = "⭐ " + S.score; $("hc").textContent = "🪙 " + S.coins; if (S.inv) renderItems(); $("hk").textContent = (S.m===3 ? "❤️".repeat(S.hearts)+" " : "") + "🔥".repeat(S.streak); }
function toast(t){ $("toast").textContent = t; $("toast").classList.remove("hide"); setTimeout(()=>$("toast").classList.add("hide"), 4000); }
const howTo = m => m.typed ? (handMode ? "จีบนิ้วกดตัวอักษรบนคีย์บอร์ดหน้าจอ แล้วกดตรวจคำตอบ" : "พิมพ์คำตอบแล้วกด Enter") : (handMode ? HAND : "ลากธนบัตรไปวางที่ช่องว่าง");

/* ===== 1) เลือกตัวละคร + เริ่มเกม ===== */
function startScreen(){
  menu(true); scene3d("idle");
  const go = cam => () => {
    PLAYER = $("pn").value.trim() || "Player " + (loadBoard().length + 1); audio(); if (cam && !handMode) startCam();
    S.score = 0; S.coins = 0; S.inv = {shield:0,time:0,hint:0,sword:0}; S.sword = false; S.order = shuffle([0,1,2]); S.left = [0,1,2]; setAvatar(); startMusic(0); doors();
  };
  showOv('<h1>🎃 Halloween Grammar Hunt AR</h1><p>Present Simple (negative) · 3 ประตู · 3 มอนสเตอร์ · 1 บอสใหญ่</p><p>เลือกตัวละครของคุณ</p><div class="chars" id="chars"></div><input id="pn" class="pn" maxlength="16" placeholder="Your name"><p>แล้วกดเริ่มเกม</p>',
    [["🖐️ เริ่มเกม (กล้อง)", go(true)], ["🖱️ เริ่มเกม (เมาส์/แตะ)", go(false)], ["📊 Ranking", viewRank]]);
  CHARS.forEach(c => { const b = document.createElement("button"); b.className = "ch" + (c === AV ? " sel" : ""); b.innerHTML = "<b>"+c[0]+"</b>"+c[1];
    b.onclick = () => { AV = c; document.querySelectorAll(".ch").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); setAvatar(); }; $("chars").appendChild(b); });
}

/* ===== 2) ประตู: ประตูแต่ละบานซ่อน Mission ที่สุ่มไว้ เลือกแล้วไม่ซ้ำ ===== */
function doors(){                       // ตัวละครเดินเข้าประตูเอง (สุ่มบานที่เหลือ) ไม่ต้องเลือก
  warn(0); clearInterval(tm); S.locked = true;
  if (!S.left.length) return bossIntro();
  menu(true); scene3d("doors"); $("ov").classList.add("hide");
  const d = S.left[Math.random() * S.left.length | 0]; S.m = S.order[d];
  toast("🚶 กำลังเดินเข้า Door " + (d+1) + " ...");
  walkIn(d, () => { S.left = S.left.filter(x => x !== d); fightIntro(S.m); });
}
function fightIntro(mi){
  const mo = MON[mi], m = MISSIONS[mi]; startMusic(mi); menu(true); scene3d("fight", mi);
  showOv("<h1>"+mo[0]+" "+mo[1]+" appears!</h1><h2>"+m.name+"</h2><p>"+m.how+"</p><p>⚔️ ตอบถูกทุกข้อเพื่อชนะ ตอบผิดต้องเริ่มสู้ใหม่!</p><p>"+howTo(m)+"</p>", [["Fight! ⚔️", () => fight(mi)]], true);
}
function bossIntro(){
  S.m = 3; startMusic(2); menu(true); scene3d("fight", 3);
  showOv("<h1>🐉 Dragon Boss!</h1><p>คำถามจากทุก Mission มารวมกัน ทั้งลากธนบัตร เรียงตัวอักษร และเขียนตอบ!</p><p>คุณมีหัวใจ ❤️❤️❤️ ตอบผิดเสียหัวใจ 1 ดวง</p>", [["Fight! ⚔️", () => fight(3)]], true);
}

/* ===== 3) การต่อสู้: สุ่มคำถามใหม่ทุกครั้งที่เริ่มสู้ ===== */
function fight(mi){
  S.m = mi; S.i = 0; S.streak = 0; S.mStart = S.score; S.cStart = S.coins; S.hearts = mi===3 ? BOSS_HEARTS : 1;
  S.sword = S.inv.sword > 0; if (S.sword) S.inv.sword--;   // ใช้ Fire Sword ตลอดการสู้ครั้งนี้
  const pool = mi===3 ? MISSIONS.flatMap((m,k) => m.data.map(q => ({...q, mi:k}))) : MISSIONS[mi].data.map(q => ({...q, mi}));
  S.q = shuffle(pool).slice(0, mi===3 ? BOSS_Q : BATTLE_Q);
  $("me").textContent = MON[mi][0]; render();
}
function setHp(done){ $("hpb").style.width = (S.q.length - S.i - (done?1:0)) / S.q.length * 100 + "%"; }
function render(){                      // แสดงโจทย์ข้อปัจจุบัน
  const q = S.q[S.i], m = MISSIONS[q.mi];
  S.locked = false; S.placed = ""; S.t0 = performance.now(); S.sec = TIME; warn(0); menu(false); $("tb").parentElement.style.opacity = 1;
  $("hm").textContent = S.m===3 ? "BOSS" : "M" + (S.m+1); $("hq").textContent = (S.i+1) + "/" + S.q.length; hud(); setHp(false);
  $("q").className = ""; $("q").innerHTML = q.q.replace("___", '<span id="slot" class="slot"></span>');
  $("clr").classList.toggle("hide", !m.letters);
  $("hint").textContent = m.hint + (m.letters ? " · คำนี้มี "+q.a.length+" ตัว เริ่มด้วย "+q.a[0] : "");
  const typed = !!m.typed; $("typebox").classList.toggle("hide", !typed); $("notes").classList.toggle("hide", typed);
  const box = $("notes"); box.innerHTML = "";
  if (typed){                           // โหมดเขียนตอบ
    $("opt").textContent = "ตัวเลือก: " + q.o.join("  /  "); $("kb").classList.toggle("hide", !handMode);
    const a = $("ans"); a.readOnly = handMode; a.value = ""; if (!handMode) setTimeout(()=>a.focus(), 50);
    clearInterval(tm); tm = setInterval(tick, 100); return;
  }
  let items;
  if (m.letters){ items = q.a.split(""); for (let k=0;k<5;k++){ items = shuffle(items); if (items.join("") !== q.a) break; } items = items.map(l=>[l,l,"tile"]); }
  else items = shuffle(m.opts || q.o.map(t=>[t,t])).map(o=>[o[0],o[1],""]);
  items.forEach(([label,val,cls],ix) => { const n = document.createElement("div"); n.className = "note "+cls+" c"+(ix%5); n.textContent = label; n.dataset.v = val; box.appendChild(n); });
  clearInterval(tm); tm = setInterval(tick, 100);
}
function warn(n){                       // n = วินาทีที่เหลือ (0 = ซ่อน)
  $("warn").classList.toggle("hide", !n); document.body.classList.toggle("alert", !!n);
  if (n) $("warn").innerHTML = "<b>💣 "+n+"</b><span>⚠️ ใกล้หมดเวลาแล้ว!</span>";
}
function tick(){                        // นับเวลา + เตือน 5 วินาทีสุดท้าย
  if (S.locked) return;
  const left = TIME - (performance.now() - S.t0)/1000;
  $("tb").style.width = Math.max(left,0)/TIME*100 + "%";
  $("tb").style.background = left < 5 ? "linear-gradient(90deg,#ff6b6b,#ff8a1f)" : "linear-gradient(90deg,#3ddc84,#4cc9f0,#c77dff)";
  const sec = Math.ceil(left);
  if (left > 0 && left <= 5){ warn(sec); if (sec !== S.sec){ S.sec = sec; beep(700 + (5-sec)*120, 0, .1, "square", .08); } } else warn(0);
  if (left <= 0) timeout();
}
function hitMon(){ const e = $("me"); e.classList.add("hit"); setTimeout(() => e.classList.remove("hit"), 500); setHp(true); }
function submit(val){                   // ตรวจคำตอบ
  if (S.locked) return; S.locked = true; warn(0); clearInterval(tm); $("tb").parentElement.style.opacity = .25;
  const q = S.q[S.i], m = MISSIONS[q.mi], ok = val === q.a;
  if (ok){
    gain((S.m===3 ? BOSS_PTS : PTS) * (S.sword ? 2 : 1)); S.streak++; $("q").classList.add("ok"); burst(innerWidth/2, 140); sfx("ok"); hero("jump"); hitMon(); hud();
    setTimeout(() => { if (S.streak >= STREAK) chest(); else next(); }, 900);
  } else {
    S.streak = 0; hud(); sfx("no"); hero("shake"); clockWarn(Math.max(0, TIME-(performance.now()-S.t0)/1000));
    const shown = m.opts ? m.opts.find(o=>o[1]===q.a)[0] : q.a;
    fail("<h2>🤔 เกือบแล้ว!</h2><p>"+q.why+"</p><p>✔ คำตอบ: <b>"+shown+"</b></p>");
  }
}
/* ตอบผิด/หมดเวลา: มอนสเตอร์ปกติ = เริ่มสู้ใหม่ทันที · บอส = เสียหัวใจ 1 ดวง (หมด = เริ่มบอสใหม่) */
function fail(html){
  if (S.inv.shield > 0){ S.inv.shield--; hud(); showOv(html+"<p>🛡️ Shield ช่วยไว้! ไม่ต้องเริ่มใหม่ ไปข้อต่อไปเลย</p>", [["Next ▶", next]], true); return; }
  if (S.m===3 && --S.hearts > 0){ hud(); showOv(html+"<p>เสียหัวใจ 1 ดวง ❤️ เหลือ "+S.hearts+" ดวง สู้ต่อ!</p>", [["Next ▶", next]], true); return; }
  S.score = S.mStart; S.coins = S.cStart; if (S.sword) S.inv.sword++; hud();
  showOv(html+"<p>"+MON[S.m][0]+" ชนะรอบนี้ ไม่เป็นไรนะ มาเริ่มสู้ใหม่กัน สู้ๆ! 💪</p>", [["Restart ↺", () => fight(S.m)]], true);
}
function next(){ S.i++; if (S.i < S.q.length) render(); else victory(); }
/* ===== ไอเท็ม + ร้านค้า ===== */
function renderItems(){
  const box = $("items"); box.innerHTML = "";
  const add = (t, fn, dis) => { const b = document.createElement(fn ? "button" : "span"); b.className = "it"; b.textContent = t; if (fn){ b.onclick = fn; b.disabled = dis; } box.appendChild(b); };
  add("⏱️ +7s ×"+S.inv.time, useTime, !S.inv.time); add("💡 ×"+S.inv.hint, useHint, !S.inv.hint);
  add("🛡️ ×"+S.inv.shield); add(S.sword ? "⚔️ ON ×2" : "⚔️ ×"+S.inv.sword);
}
function useTime(){ if (S.locked || !S.inv.time) return; S.inv.time--; S.t0 += 7000; sfx("pop"); hud(); }
function useHint(){                     // ใบ้: เรียงตัวอักษร=ไฮไลต์ตัวถัดไป · เขียนตอบ=ใส่ตัวแรก · เลือกธนบัตร=ซ่อนตัวเลือกผิด 1 ใบ
  if (S.locked || !S.inv.hint) return; S.inv.hint--;
  const q = S.q[S.i], m = MISSIONS[q.mi];
  if (m.letters){ const t = [...document.querySelectorAll(".tile:not(.used)")].find(n => n.dataset.v === q.a[S.placed.length]); if (t) t.classList.add("glow"); }
  else if (m.typed) setAns(q.a[0]);
  else { const w = [...document.querySelectorAll("#notes .note")].filter(n => n.dataset.v !== q.a); if (w.length) w[0].style.visibility = "hidden"; }
  sfx("pop"); hud();
}
function shop(back){
  showOv("<h2>🛒 Shop</h2><p>🪙 "+S.coins+" เหรียญ</p>" + SHOP.map(it => "<p>"+it[1]+" <b>"+it[2]+"</b> ("+it[4]+" 🪙) · "+it[3]+" · มีอยู่ "+S.inv[it[0]]+"</p>").join(""),
    SHOP.map(it => [it[1]+" "+it[4]+"🪙", () => { if (S.coins >= it[4]){ S.coins -= it[4]; S.inv[it[0]]++; sfx("pop"); } else sfx("no"); shop(back); }]).concat([["Done ▶", back]]));
}
function afterWin(){
  showOv("<h1>🎉 "+MON[S.m][1]+" defeated!</h1><p>⭐ "+S.score+" · 🪙 "+S.coins+"</p><p>แวะร้านค้าซื้อของก่อนเดินต่อได้นะ!</p>", [["🛒 Shop", () => shop(afterWin)], ["Walk on ▶", doors]], true);
}
function victory(){
  clearInterval(tm); S.locked = true; sfx("chest"); for (let i=0;i<3;i++) burst(innerWidth/2, innerHeight/2);
  menu(true); act3d("die");
  if (S.m === 3) return finish();
  afterWin();
}
/* ระเบิดหน้าจอเมื่อหมดเวลา แล้วเข้าสู่การเริ่มใหม่ */
function explode(cb){
  const b = document.createElement("div"); b.id = "boom"; b.innerHTML = "<b>💥</b>"; document.body.appendChild(b);
  $("ui").classList.add("jolt"); sfx("boom");
  for (let i=0;i<3;i++) burst(innerWidth/2, innerHeight/2);
  setTimeout(() => { b.remove(); $("ui").classList.remove("jolt"); cb(); }, 1500);
}
function timeout(){
  S.locked = true; clearInterval(tm); cancelGrab(); warn(0); hero("shake");
  explode(() => fail("<h2>💥 หมดเวลา!</h2><p>ไม่เป็นไรนะ ทุกคนช้าได้</p>"));
}
/* ตอบผิด: นาฬิกา ⏰ ลอยเข้ามาเตือนเวลา */
function clockWarn(left){
  const old = $("clk"); if (old) old.remove();
  const d = document.createElement("div"); d.id = "clk";
  d.innerHTML = "<b>⏰</b><span>เหลือเวลา "+Math.ceil(left)+" วินาที · ระวังเวลานะ สู้ๆ!</span>";
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
  [0,.25,.5,.75].forEach((t,i) => beep(i%2?900:1200,t,.07,"square",.05));
}
function chest(){                       // หีบสมบัติ: ตอบถูกติดกัน 3 ข้อ
  S.streak = 0; hud(); clearInterval(tm); sfx("chest");
  const prizes = shuffle(["friend","empty","x2"]);
  showOv("<h2>🎁 ตอบถูกติดกัน "+STREAK+" ข้อ!</h2><p>เลือกหีบสมบัติ 1 กล่อง</p>", prizes.map(p => ["🎁", () => {
    let msg;
    if (p === "friend"){ gain(FRIEND_PTS); msg = "🤝 ได้แต้มเพื่อน +"+FRIEND_PTS+"!"; }
    else if (p === "x2"){ gain(S.score - S.mStart); msg = "✨ คะแนนของการสู้นี้ ×2!"; }   // คูณเฉพาะแต้มที่ได้ในการสู้รอบนี้
    else msg = "💨 หีบว่าง ไม่เป็นไร ไปต่อกัน!";
    hud(); sfx("chest"); showOv("<h2>"+msg+"</h2><p>⭐ "+S.score+"</p>", [["Continue ▶", next]]);
  }]));
}

/* ===== 4) อันดับ (ภาษาอังกฤษ) เก็บใน localStorage ของเครื่องนี้ ===== */
const esc = t => t.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function loadBoard(){ try { return JSON.parse(localStorage.getItem("hwBoard") || "[]"); } catch(e){ return memBoard; } }
function rankTable(list, mt){
  const medal = ["🥇","🥈","🥉"];
  return '<table class="rank"><tr><th>Rank</th><th>Player</th><th>Score</th></tr>' + list.slice(0,20).map((e,i) =>
    "<tr"+(e.t===mt?' class="me"':"")+"><td>"+(medal[i]||(i+1))+"</td><td>"+(e.av||"")+" "+esc(e.name)+"</td><td>"+e.score+" pts</td></tr>").join("") + "</table>";
}
function viewRank(){
  const l = loadBoard();
  showOv("<h1>📊 Ranking</h1>" + (l.length ? rankTable(l, 0) : "<p>No players yet</p>"),
    [["◀ Back", startScreen], ["🗑️ Clear", () => { try { localStorage.removeItem("hwBoard"); } catch(e){} memBoard = []; startScreen(); }]]);
}
function finish(){
  stopMusic(); menu(true); scene3d("idle");
  const b = loadBoard(), me = {name:PLAYER, av:AV[0], score:S.score, t:Date.now()};
  b.push(me); b.sort((x,y) => y.score - x.score || x.t - y.t);
  const list = b.slice(0,30); memBoard = list; try { localStorage.setItem("hwBoard", JSON.stringify(list)); } catch(e){}
  const place = list.findIndex(e => e.t === me.t) + 1;
  const msg = S.score >= 250 ? "Amazing! You defeated the Dragon Boss like a hero! 🐉🏆" : "You defeated the Dragon Boss! Play again for a higher score 💪";
  showOv("<h1>🏆 Final Ranking</h1><p>"+AV[0]+" "+esc(PLAYER)+": place #"+(place||"-")+" · ⭐ "+S.score+" points</p><p>"+msg+"</p>"+rankTable(list, me.t),
    [["Next player ▶", startScreen]]);
}

/* =====================================================
   ระบบจับ-ลาก-วาง (ใช้ร่วมกันทั้งมือและเมาส์/ทัช)
   ===================================================== */
const P = {x:0,y:0,down:false};
function move(x,y){ P.x=x; P.y=y; if (S.grab){ S.grab.g.style.left=x+"px"; S.grab.g.style.top=y+"px"; } }
function pressAt(isHand){               // เริ่มจับ (หรือกดปุ่มถ้าเป็นโหมดมือ)
  const el = document.elementFromPoint(P.x,P.y); if (!el) return;
  const b = el.closest("button"); if (b){ if (isHand) b.click(); return; }
  const n = el.closest(".note");
  if (n && !S.locked && !n.classList.contains("used") && !S.grab){
    const g = n.cloneNode(true); g.classList.add("ghost"); document.body.appendChild(g);
    n.classList.add("held"); S.grab = {n,g}; move(P.x,P.y); sfx("pop");
  }
}
function cancelGrab(){ if (!S.grab) return; S.grab.g.remove(); S.grab.n.classList.remove("held"); S.grab = null; }
function release(){                     // ปล่อย: ถ้าอยู่เหนือช่องว่างให้วาง
  const G = S.grab; if (!G) return; cancelGrab();
  const s = $("slot"); if (!s || S.locked) return;
  const r = s.getBoundingClientRect(), p = 40;
  if (P.x>r.left-p && P.x<r.right+p && P.y>r.top-p && P.y<r.bottom+p) place(G.n);
}
function place(n){ sfx("drop");
  const q = S.q[S.i], m = MISSIONS[q.mi];
  if (m.letters){ S.placed += n.dataset.v; n.classList.add("used"); $("slot").textContent = S.placed; if (S.placed.length === q.a.length) submit(S.placed); }
  else { $("slot").textContent = n.textContent; submit(n.dataset.v); }
}
/* ระบบเขียนตอบ: ไม่สนตัวพิมพ์เล็กใหญ่และ apostrophe (dont = don't) */
const norm = s => s.toLowerCase().replace(/[’‘`´']/g,"").replace(/\s+/g," ").trim();

};
function onHands(r){
  LM = (r.multiHandLandmarks && r.multiHandLandmarks[0]) || null;
  if (!LM){ if (P.down){ P.down=false; release(); } return; }
  const a = LM[4], b = LM[8], pos = mp({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
  const size = Math.hypot(LM[0].x-LM[9].x, LM[0].y-LM[9].y) || .1, ratio = Math.hypot(a.x-b.x,a.y-b.y)/size;
  const pinch = P.down ? ratio < .5 : ratio < .32;      // มี hysteresis กันสั่น
  move(P.x + (pos.x-P.x)*.55, P.y + (pos.y-P.y)*.55);   // ทำให้เคอร์เซอร์เคลื่อนที่นุ่มนวล
  if (pinch && !P.down){ P.down = true; pressAt(true); }
  else if (!pinch && P.down){ P.down = false; release(); }
}
async function startCam(){
  try {
    if (!window.Hands) throw new Error("hands lib");
    cam.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
    await cam.play();
    hands = new Hands({locateFile: f => "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/" + f});
    hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:.6, minTrackingConfidence:.5});
    hands.onResults(onHands); await hands.initialize();
    handMode = true; toast("🖐️ พร้อมแล้ว! ยกมือขึ้นหน้ากล้อง"); loop();
  } catch(e){ handMode = false; toast("ใช้กล้อง/ตรวจจับมือไม่ได้ → เล่นด้วยเมาส์หรือนิ้วแตะแทน"); }
}

    mo.position.x = G.mx + ((G.act==="hurt" || G.act==="hurt2") && a<.6 ? -Math.sin(a/.6*Math.PI)*amp : 0) + (G.act==="hit" && a<.5 ? Math.sin(a*40)*.18 + Math.sin(a/.5*Math.PI)*.6 : 0);
    mo.rotation.z = G.act==="hit" && a<.5 ? Math.sin(a*30)*.25 : 0; }
  if (mo && G.dead){ mo.scale.setScalar(Math.max(1 - a, .001) * G.ms); mo.rotation.y += .2; }
  G.r.render(G.sc, G.cam);
}
